<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股觀測站｜雲端版</title><meta name="theme-color" content="#0a111c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><style>
:root{color-scheme:dark;--bg:#0a111c;--panel:#111c2b;--border:#223247;--text:#e5edf5;--muted:#92a6ba;--red:#f26472;--green:#22c9a2;--blue:#59b8f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Microsoft JhengHei",sans-serif}main{max-width:1250px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:26px;margin:0 0 5px}small,.muted{color:var(--muted)}button,a.button,select{font:inherit;border:1px solid var(--border);background:#19293c;color:var(--text);padding:9px 13px;border-radius:8px;text-decoration:none;cursor:pointer}button.primary{background:#1775b4;border-color:#278ed1}button.active{background:#28577a;border-color:#59b8f0}button:disabled{opacity:.5;cursor:wait}.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0 12px}.card,.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px}.card{padding:15px}.big{font-size:clamp(21px,3vw,32px);font-weight:700;font-variant-numeric:tabular-nums;margin:5px 0}.panel{padding:12px;margin:12px 0}.label{font-size:13px;color:var(--muted)}.chart{position:relative;width:100%;height:650px}canvas{width:100%;height:100%;touch-action:pan-y}.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0 0}.tooltip{min-height:25px;color:#cbdcec;font-size:12px;font-variant-numeric:tabular-nums}.note{font-size:12px;color:var(--muted);line-height:1.7}#status{padding:8px 0;color:#a2d7fd;white-space:pre-wrap}details{color:#a7b5c7;font-size:12px;white-space:pre-wrap}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}th,td{text-align:right;padding:9px 7px;border-bottom:1px solid var(--border)}th:first-child,td:first-child{text-align:left}.scroll{overflow:auto}.up{color:var(--red)}.down{color:var(--green)}@media(max-width:640px){main{padding:12px}.cards{grid-template-columns:repeat(2,1fr)}.chart{height:560px}.card{padding:10px}h1{font-size:22px}button,a.button{padding:8px 10px}.panel{padding:9px}}
@media(max-width:600px){main{padding:12px 10px 25px}h1{font-size:23px}.toolbar{gap:5px}button,select,.button{min-height:38px;padding:7px 9px} .chart{height:650px} .big{font-size:22px} .tooltip{min-height:48px} } #err{white-space:pre-wrap;overflow-wrap:anywhere} </style></head><body><main><header><div><h1>台股觀測站 <span style="color:#59b8f0;font-size:13px">V2.0 CLOUD</span></h1><small>TAIEX ｜ 價量 × 融資風險監控</small></div><div class="toolbar"><button class="primary" id="update">重新整理</button><a class="button" href="./data/daily.csv" download="TAIEX_daily.csv">匯出日資料</a></div></header><div id="status">載入中…</div><section class="cards"><div class="card"><div class="label">加權指數</div><div class="big" id="price">—</div><small id="change">—</small></div><div class="card"><div class="label" id="volLabel">成交金額（億）</div><div class="big" id="volume">—</div><small id="vd">—</small></div><div class="card"><div class="label">上市融資維持率</div><div class="big" id="margin">—</div><small id="md">—</small></div><div class="card"><div class="label">融資餘額（億元）</div><div class="big" id="balance">—</div><small id="bd">—</small></div></section><section class="panel"><div class="toolbar"><button id="day">日 K</button><button id="week" class="active">週 K</button><select id="period"><option value="all">2026 起至今</option><option value="90">近 3 個月</option><option value="30">近 1 個月</option></select><select id="vm"><option value="money">成交金額</option><option value="shares">成交股數</option></select></div><div class="legend"><span style="color:#f26472">■ 上漲</span><span style="color:#22c9a2">■ 下跌</span><label><input type="checkbox" id="ma" checked> MA5 / MA20 / MA60（日 K）</label><span style="color:#59b8f0">━ 維持率</span></div><div class="tooltip" id="tip">移動滑鼠或點按圖表查看數值</div><div class="chart"><canvas id="chart" aria-label="加權指數、成交量、融資維持率、餘額圖"></canvas></div><div class="note" id="source"></div></section><section class="panel"><b>近期交易資料</b><div class="scroll"><table><thead><tr><th>日期</th><th>收盤</th><th>成交億</th><th>維持率%</th><th>融資餘額億</th><th>來源</th></tr></thead><tbody id="rows"></tbody></table></div></section><details id="errors"><summary>更新紀錄 / 資料提醒</summary><div id="err"></div></details><p class="note">雲端排程：台灣時間平日 22:17，隔日 01:43 補抓；實際執行可能延遲。手機重新整理只讀取雲端最新檔案，不會直接觸發資料收集。融資維持率為市場統計或估算，非個人整戶擔保維持率；160%、150% 等線為自訂觀察線，不是買賣訊號。資料不完整時保留空白，不補造數值。</p></main><script>
let state={daily:[],weekly:[],status:{}},mode='week',hover=-1,shown=[];const $=x=>document.getElementById(x), fmt=(n,d=2)=>n==null?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}),valid=v=>typeof v==='number'&&Number.isFinite(v);const canvas=$('chart'),ctx=canvas.getContext('2d');
function weekKey(d){let x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));return x.toISOString().slice(0,10)}
function weeks(){let map=new Map(state.weekly.map(r=>[weekKey(r.date),{...r,source:'既有週資料（舊口徑）'}]));let group=new Map();for(let r of state.daily){let k=weekKey(r.date);if(!group.has(k))group.set(k,[]);group.get(k).push(r)}for(let [k,a] of group){let first=a[0],last=a.at(-1),old=map.get(k);if(old&&(last.date<old.date||Math.abs(a.reduce((s,r)=>s+(r.turnover_100m||0),0)-old.turnover_100m)>Math.max(1,old.turnover_100m*.03)))continue;let m=last.margin_pct,b=last.balance;map.set(k,{date:last.date,open:first.open,close:last.close,high:Math.max(...a.map(r=>r.high)),low:Math.min(...a.map(r=>r.low)),turnover_100m:a.reduce((s,r)=>s+(r.turnover_100m||0),0),volume:a.every(r=>valid(r.volume))?a.reduce((s,r)=>s+r.volume,0):null,margin_pct:m??(old?.date===last.date?old.margin_pct:null),balance:b,source:last.source||(old?.date===last.date?'既有週資料（舊口徑）':'未公布')})}return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date))}
function getRows(){let a=mode==='day'?state.daily:weeks();if($('period').value==='all')return a;let end=a.at(-1)?.date;if(!end)return a;let cut=new Date(end+'T00:00:00Z');cut.setUTCDate(cut.getUTCDate()-Number($('period').value));return a.filter(r=>r.date>=cut.toISOString().slice(0,10))}
function render(){shown=getRows();let all=state.daily.length&&state.daily.at(-1).date>=(state.weekly.at(-1)?.date||'')?state.daily:weeks(), isDaily=all===state.daily,r=all.at(-1),p=all.at(-2),m=[...all].reverse().find(x=>valid(x.margin_pct)),b=[...all].reverse().find(x=>valid(x.balance));$('day').classList.toggle('active',mode==='day');$('week').classList.toggle('active',mode==='week');$('price').textContent=fmt(r?.close);let ch=r&&p?(r.close/p.close-1)*100:null;$('change').textContent=ch==null?'—':(ch>=0?'▲ ':'▼ ')+fmt(Math.abs(ch))+'% '+(isDaily?'日漲跌':'週漲跌');$('change').className=ch>=0?'up':'down';$('volLabel').textContent=$('vm').value==='money'?'成交金額（億）':'成交股數（億股）';$('volume').textContent=fmt(r?($('vm').value==='money'?r.turnover_100m:valid(r.volume)?r.volume/1e8:null):null,1);$('vd').textContent=(r?.date||'—')+(isDaily?' · 當日':' · 週合計');$('margin').textContent=valid(m?.margin_pct)?fmt(m.margin_pct)+'%':'—';$('md').textContent=m?m.date+' · '+(m.source||'既有週資料（舊口徑）'):'尚未取得';$('balance').textContent=fmt(b?.balance,1);$('bd').textContent=b?.date||'尚未取得';$('rows').replaceChildren(...[...shown].reverse().slice(0,12).map(r=>{let tr=document.createElement('tr');for(let s of [r.date,fmt(r.close),fmt(r.turnover_100m,1),fmt(r.margin_pct),fmt(r.balance,1),r.source||'—']){let td=document.createElement('td');td.textContent=s;tr.append(td)}return tr}));$('source').textContent=mode==='week'?'週 K：首日開盤、最高、最低、末日收盤；成交金額加總，融資維持率與餘額取週末交易日。內建既有週資料（未重新驗證）至 2026/11/13，與新抓取的估算口徑可能不同。':'日 K 與成交金額：TWSE；融資維持率：TWSE 估算（見資料來源欄）。日資料尚未補齊時請至 GitHub Actions 執行更新。';draw()}
function draw(){let rect=canvas.getBoundingClientRect(),W=rect.width,H=rect.height,dpr=devicePixelRatio||1;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);let a=shown,n=a.length;if(!n){ctx.fillStyle='#92a6ba';ctx.font='14px system-ui';ctx.fillText('尚無日資料，請先執行 GitHub Actions 更新',15,35);return}let L=8,R=W-65,pw=R-L,step=pw/n,x=i=>L+(i+.5)*step;let panels=[[20,H*.41],[H*.47,H*.60],[H*.66,H*.80],[H*.86,H-24]], colors=['#f6bf66','#6fb5ff','#b997ff'];function line(x1,y1,x2,y2,c,dash=[]){ctx.strokeStyle=c;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])}function text(s,x,y,c='#92a6ba',align='left'){ctx.fillStyle=c;ctx.font='11px system-ui';ctx.textAlign=align;ctx.fillText(s,x,y)}function scale(vals,p,zero=false){let vv=vals.filter(valid);let lo=zero?0:Math.min(...vv),hi=Math.max(...vv);if(!vv.length){lo=0;hi=1}let diff=hi-lo||1;hi+=diff*.10;if(!zero)lo-=diff*.10;return {lo,hi,y:v=>p[1]-(v-lo)/(hi-lo)*(p[1]-p[0])}}function grid(s,p,title,precision=0){text(title,L,p[0]-7,'#d1e2f0');for(let j=0;j<=3;j++){let v=s.lo+(s.hi-s.lo)*j/3,y=s.y(v);line(L,y,R,y,'#26374a');text(fmt(v,precision),R+5,y+4)}}let maSeries=[];if(mode==='day'&&$('ma').checked){for(let k of [5,20,60]){let map=new Map(state.daily.map((r,i)=>[r.date,i>=k-1?state.daily.slice(i-k+1,i+1).reduce((s,t)=>s+t.close,0)/k:null]));maSeries.push(a.map(r=>map.get(r.date)))}}let price=scale([...a.flatMap(r=>[r.high,r.low]),...maSeries.flat()],panels[0]);grid(price,panels[0],'加權指數 '+(maSeries.length?' • MA5 / 20 / 60':''));a.forEach((r,i)=>{let c=r.close>=r.open?'#f26472':'#22c9a2';line(x(i),price.y(r.high),x(i),price.y(r.low),c);ctx.fillStyle=c;ctx.fillRect(x(i)-Math.max(1,step*.3),Math.min(price.y(r.open),price.y(r.close)),Math.max(2,step*.6),Math.max(1,Math.abs(price.y(r.open)-price.y(r.close))))});function series(values,s,c){ctx.strokeStyle=c;ctx.lineWidth=1.6;ctx.beginPath();let open=false;values.forEach((v,i)=>{if(!valid(v)){open=false;return}if(!open)ctx.moveTo(x(i),s.y(v));else ctx.lineTo(x(i),s.y(v));open=true});ctx.stroke();ctx.lineWidth=1;values.forEach((v,i)=>{if(valid(v)&&(i===0||!valid(values[i-1]))&&(i===n-1||!valid(values[i+1]))){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x(i),s.y(v),2.5,0,Math.PI*2);ctx.fill()}})}maSeries.forEach((v,i)=>series(v,price,colors[i]));let v=a.map(r=>$('vm').value==='money'?r.turnover_100m:valid(r.volume)?r.volume/1e8:null),vs=scale(v,panels[1],true);grid(vs,panels[1],$('vm').value==='money'?'成交金額（億元）':'成交股數（億股）');v.forEach((z,i)=>{if(!valid(z))return;ctx.fillStyle=a[i].close>=a[i].open?'#bb5260':'#1d9d82';ctx.fillRect(x(i)-step*.32,vs.y(z),Math.max(1,step*.64),panels[1][1]-vs.y(z))});let m=a.map(r=>r.margin_pct),ms=scale([...m,150,160,180],panels[2]);grid(ms,panels[2],'上市融資維持率（%）',0);for(let q of [150,160,180]){line(L,ms.y(q),R,ms.y(q),q===150?'#b95a65':'#6a6471',[4,4])}series(m,ms,'#59b8f0');let b=a.map(r=>r.balance),bs=scale(b,panels[3]);grid(bs,panels[3],'融資餘額（億元）');series(b,bs,'#c1a3f6');if(!b.some(valid))text('尚無資料',L+10,(panels[3][0]+panels[3][1])/2);let every=Math.max(1,Math.ceil(n/Math.max(3,Math.floor(pw/90))));a.forEach((r,i)=>{if(i%every===0)text(r.date.slice(5),x(i),H-5,'#92a6ba','center')});if(hover>=0&&hover<n){line(x(hover),panels[0][0],x(hover),panels[3][1],'#b1c8da',[3,3]);let r=a[hover];$('tip').textContent=`${r.date}  開 ${fmt(r.open)}  高 ${fmt(r.high)}  低 ${fmt(r.low)}  收 ${fmt(r.close)} ｜ 成交 ${fmt(r.turnover_100m,1)} 億 ｜ 維持率 ${fmt(r.margin_pct)}%`}}
function pointer(e){let rect=canvas.getBoundingClientRect();hover=Math.max(0,Math.min(shown.length-1,Math.floor((e.clientX-rect.left-8)/(rect.width-73)*shown.length)));draw()}canvas.addEventListener('pointermove',pointer);canvas.addEventListener('pointerdown',pointer);canvas.addEventListener('pointerleave',()=>{hover=-1;draw()});new ResizeObserver(draw).observe(canvas);for(let id of ['period','ma','vm'])$(id).onchange=render;$('day').onclick=()=>{mode='day';hover=-1;render()};$('week').onclick=()=>{mode='week';hover=-1;render()};async function load(){try{$('update').disabled=true;let r=await fetch('./data/market.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);state=await r.json();let st=state.status||{};if(!window.initialMode){mode=state.daily.length?'day':'week';window.initialMode=true}let latest=state.daily.at(-1)?.date||state.weekly.at(-1)?.date||'—';$('status').textContent=(st.message||'就緒')+' ｜ 最新交易資料 '+latest+(st.last_attempt?' ｜ 抓取 '+st.last_attempt.slice(0,16).replace('T',' '):'')+' ｜ 日資料 '+state.daily.length+' 筆'+(st.missing_margin!=null?'・缺維持率 '+st.missing_margin+' 筆':'')+(r.headers.get('X-Offline')?' ｜ 離線快取':'');$('err').textContent=(st.errors||[]).join('\n')||'無錯誤紀錄';render()}catch(e){$('status').textContent='無法讀取雲端資料：'+e.message}finally{$('update').disabled=false}}$('update').onclick=load;load();setInterval(load,300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
